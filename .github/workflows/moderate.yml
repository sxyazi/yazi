name: Moderate

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: moderate
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/github-script@v9
        with:
          script: |
            const moderate = require('./scripts/moderate/main.js')
            await moderate({github, context, core})
