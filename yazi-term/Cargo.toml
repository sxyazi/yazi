[package]
name                   = "yazi-term"
description            = "Cross-platform virtual terminal"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yazi-macro = { path = "../yazi-macro", version = "26.9.1" }
yazi-shim  = { path = "../yazi-shim", version = "26.9.1" }
yazi-tty   = { path = "../yazi-tty", version = "26.9.1" }

# External dependencies
anyhow      = { workspace = true }
base64      = { workspace = true }
bitflags    = { workspace = true }
compact_str = { workspace = true }
futures     = { workspace = true }
mlua        = { workspace = true }
parking_lot = { workspace = true }
serde       = { workspace = true }
strum       = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"
rustix      = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [ "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading" ] }
