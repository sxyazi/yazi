[package]
name                   = "yazi-ffi"
description            = "Yazi foreign function interface"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yazi-macro = { path = "../yazi-macro", version = "26.9.1" }
yazi-shim  = { path = "../yazi-shim", version = "26.9.1" }

# External dependencies
anyhow        = { workspace = true }
chrono        = { workspace = true }
data-encoding = { workspace = true }
libc          = { workspace = true }
mlua          = { workspace = true }
rand          = { workspace = true }
strum         = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }

[target."cfg(unix)".dependencies]
rustix = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2                 = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-foundation      = { workspace = true }

[target.'cfg(windows)'.dependencies]
scopeguard  = { workspace = true }
windows     = { version = "0.62.2", features = [ "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Com" ] }
windows-sys = { version = "0.61.2", features = [ "Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Globalization", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging" ] }
