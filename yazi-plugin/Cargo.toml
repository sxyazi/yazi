[package]
name                   = "yazi-plugin"
description            = "Yazi plugin system"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default      = [ "vendored-lua" ]
vendored-lua = [ "mlua/vendored" ]

[dependencies]
yazi-adapter   = { path = "../yazi-adapter", version = "26.8.15" }
yazi-binding   = { path = "../yazi-binding", version = "26.8.15" }
yazi-boot      = { path = "../yazi-boot", version = "26.8.15" }
yazi-codegen   = { path = "../yazi-codegen", version = "26.8.15" }
yazi-config    = { path = "../yazi-config", version = "26.8.15" }
yazi-core      = { path = "../yazi-core", version = "26.8.15" }
yazi-dds       = { path = "../yazi-dds", version = "26.8.15" }
yazi-emulator  = { path = "../yazi-emulator", version = "26.8.15" }
yazi-fs        = { path = "../yazi-fs", version = "26.8.15" }
yazi-macro     = { path = "../yazi-macro", version = "26.8.15" }
yazi-proxy     = { path = "../yazi-proxy", version = "26.8.15" }
yazi-runner    = { path = "../yazi-runner", version = "26.8.15" }
yazi-scheduler = { path = "../yazi-scheduler", version = "26.8.15" }
yazi-shared    = { path = "../yazi-shared", version = "26.8.15" }
yazi-shim      = { path = "../yazi-shim", version = "26.8.15" }
yazi-term      = { path = "../yazi-term", version = "26.8.15" }
yazi-tty       = { path = "../yazi-tty", version = "26.8.15" }
yazi-vfs       = { path = "../yazi-vfs", version = "26.8.15" }
yazi-widgets   = { path = "../yazi-widgets", version = "26.8.15" }

# External dependencies
ansi-to-tui      = { workspace = true }
anyhow           = { workspace = true }
base64           = { workspace = true }
futures          = { workspace = true }
inventory        = { workspace = true }
mlua             = { workspace = true }
parking_lot      = { workspace = true }
percent-encoding = { workspace = true }
ratatui-core     = { workspace = true }
ratatui-widgets  = { workspace = true }
reqwest          = { workspace = true }
serde_json       = { workspace = true }
tokio            = { workspace = true }
tokio-stream     = { workspace = true }
twox-hash        = { workspace = true }
unicode-width    = { workspace = true }

[target."cfg(unix)".dependencies]
libc  = { workspace = true }
uzers = { workspace = true }
