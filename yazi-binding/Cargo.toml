[package]
name                   = "yazi-binding"
description            = "Yazi Lua bindings"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default      = [ "vendored-lua" ]
vendored-lua = [ "mlua/vendored" ]

[dependencies]
yazi-codegen = { path = "../yazi-codegen", version = "26.8.15" }
yazi-macro   = { path = "../yazi-macro", version = "26.8.15" }
yazi-shared  = { path = "../yazi-shared", version = "26.8.15" }
yazi-shim    = { path = "../yazi-shim", version = "26.8.15" }

# External dependencies
ansi-to-tui     = { workspace = true }
anyhow          = { workspace = true }
compact_str     = { workspace = true }
futures         = { workspace = true }
hashbrown       = { workspace = true }
http-body-util  = "0.1.5"
hyper           = { version = "1.11.1", features = [ "client", "http1" ] }
hyper-util      = { version = "0.1.20", features = [ "tokio" ] }
image           = { workspace = true }
inventory       = { workspace = true }
mlua            = { workspace = true }
ratatui-core    = { workspace = true }
ratatui-widgets = { workspace = true }
reqwest         = { workspace = true }
serde           = { workspace = true }
strum           = { workspace = true }
tokio    	      = { workspace = true }
tokio-util      = { workspace = true }
unicode-width   = { workspace = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [ "Win32_Foundation", "Win32_System_JobObjects" ] }
