[package]
name                   = "yazi-fs"
description            = "Yazi file system"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[build-dependencies]
cfg_aliases = "0.2.2"

[dependencies]
yazi-binding = { path = "../yazi-binding", version = "26.8.15" }
yazi-codegen = { path = "../yazi-codegen", version = "26.8.15" }
yazi-ffi     = { path = "../yazi-ffi", version = "26.8.15" }
yazi-macro   = { path = "../yazi-macro", version = "26.8.15" }
yazi-shared  = { path = "../yazi-shared", version = "26.8.15" }
yazi-shim    = { path = "../yazi-shim", version = "26.8.15" }

# External dependencies
anyhow                = { workspace = true }
arc-swap              = { workspace = true }
bitflags              = { workspace = true }
data-encoding         = { workspace = true }
dirs                  = { workspace = true }
either                = { workspace = true }
foldhash              = { workspace = true }
hashbrown             = { workspace = true }
inventory             = { workspace = true }
libc                  = { workspace = true }
mlua                  = { workspace = true }
parking_lot           = { workspace = true }
rand                  = { workspace = true }
regex                 = { workspace = true }
regex-syntax          = { workspace = true }
scopeguard            = { workspace = true }
serde                 = { workspace = true }
serde_with            = { workspace = true }
strum                 = { workspace = true }
tokio                 = { workspace = true }
typed-path            = { workspace = true }
unicode-normalization = { workspace = true }

[target."cfg(unix)".dependencies]
uzers = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
percent-encoding = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows     = { version = "0.62.2", features = [ "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem" ] }
windows-sys = { version = "0.61.2", features = [ "Win32_Storage_FileSystem" ] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = { workspace = true }
ds_parser           = "0.4.0"
objc2               = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2.6"
