[package]
name                   = "yazi-cli"
description            = "Yazi command-line interface"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yazi-adapter  = { path = "../yazi-adapter", version = "26.9.1" }
yazi-boot     = { path = "../yazi-boot", version = "26.9.1" }
yazi-config   = { path = "../yazi-config", version = "26.9.1" }
yazi-dds      = { path = "../yazi-dds", version = "26.9.1" }
yazi-emulator = { path = "../yazi-emulator", version = "26.9.1" }
yazi-fs       = { path = "../yazi-fs", version = "26.9.1" }
yazi-headless = { path = "../yazi-headless", version = "26.9.1" }
yazi-macro    = { path = "../yazi-macro", version = "26.9.1" }
yazi-shared   = { path = "../yazi-shared", version = "26.9.1" }
yazi-shim     = { path = "../yazi-shim", version = "26.9.1" }
yazi-term     = { path = "../yazi-term", version = "26.9.1" }
yazi-tty      = { path = "../yazi-tty", version = "26.9.1" }
yazi-version  = { path = "../yazi-version", version = "26.9.1" }

# External dependencies
anyhow        = { workspace = true }
clap          = { workspace = true }
clap_complete = { workspace = true }
hashbrown     = { workspace = true }
regex         = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true }
toml          = { workspace = true }
twox-hash     = { workspace = true }

[[bin]]
name = "ya"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/yazi-{ target }{ archive-suffix }"
bin-dir = "yazi-{ target }/{ bin }{ binary-ext }"
